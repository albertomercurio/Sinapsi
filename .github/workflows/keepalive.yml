# Keeps the Supabase Free project from pausing after 7 days without activity.
#
# - Calls public.ping(), a function that returns now() and touches NO data, with
#   the publishable key. Nothing personal ever passes through GitHub.
# - The repository is public: GitHub disables scheduled workflows after 60 days
#   without repository activity, so the job re-enables itself through the API.
#
# Repository secrets: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (Settings → Secrets → Actions).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database (no data touched)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
      - name: Keep this scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
